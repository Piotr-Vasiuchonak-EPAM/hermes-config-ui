services:
  hermes-config-ui:
    build: .
    container_name: hermes-config-ui
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      - VIRTUAL_HOST=hermes-config.privet.one
      - VIRTUAL_PORT=8080
      - HCUI_CONFIG=/hermes-data/config.yaml
    volumes:
      # directory mount, not a file mount: the atomic rename changes the inode
      - ${HCUI_HERMES_DATA:-${HOME}/hermes/data}:/hermes-data
      - ${HCUI_HISTORY:-${HOME}/.local/share/hermes-config-ui/history}:/history
      - ${HCUI_RUN:-${HOME}/.local/share/hermes-config-ui/run}:/run/hcui
    networks: [proxy-net]

networks:
  proxy-net:
    external: true
